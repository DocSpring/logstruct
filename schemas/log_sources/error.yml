source: Error

consts:
  # Can be any source
  source: Source

# The request an error happened in, when there was one
add_request_fields: true
additional_data: true

events:
  Error:
    fields:
      ErrorClass: 'T.class_of(Exception)'
      Message: String
      # The exception's message, when the line's message is the one logged with it
      ErrorMessage:
        type: String
        required: false
      Backtrace:
        type: 'T::Array[String]'
        required: false
      # An error the app didn't handle in a request: the response's status, and the error's cause
      Status:
        type: Integer
        required: false
      CauseClass:
        type: String
        required: false
      CauseMessage:
        type: String
        required: false
