source: Error

consts:
  # Can be any source
  source: Source

additional_data: true

events:
  Error:
    fields:
      ErrorClass: 'T.class_of(Exception)'
      Message: String
      # The exception's message, when the line's message is the one logged with it
      ErrorMessage:
        type: String
        required: false
      Backtrace:
        type: 'T::Array[String]'
        required: false
