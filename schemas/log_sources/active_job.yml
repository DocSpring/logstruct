source: ActiveJob

consts:
  source: Source::Job

base:
  default_required: false
  fields:
    JobId:
      type: String
      required: true
    JobClass:
      type: String
      required: true
    QueueName: Symbol
    Arguments: 'T::Array[T.untyped]'
    Executions: Integer
    ProviderJobId: String

events:
  Enqueue:

  Schedule:
    fields:
      ScheduledAt: Time

  Start:
    fields:
      StartedAt: Time
      Attempt:
        type: Integer
        required: false

  Finish:
    fields:
      DurationMs: Float
      FinishedAt: Time

  # retry_on caught the job's exception and enqueued the job again, after wait_ms
  Retry:
    fields:
      ErrorClass:
        type: 'T.class_of(Exception)'
        required: false
      Message:
        type: String
        required: false
      WaitMs:
        type: Float
        required: false

  # retry_on caught the exception again after its last attempt
  RetryStopped:
    fields:
      ErrorClass:
        type: 'T.class_of(Exception)'
        required: true
      Message:
        type: String
        required: true

  # discard_on caught the job's exception and dropped the job
  Discard:
    fields:
      ErrorClass:
        type: 'T.class_of(Exception)'
        required: true
      Message:
        type: String
        required: true

  # The job raised an exception
  Error:
    fields:
      ErrorClass:
        type: 'T.class_of(Exception)'
        required: true
      Message:
        type: String
        required: true
      Backtrace:
        type: 'T::Array[String]'
        required: false
