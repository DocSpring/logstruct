source: ActiveJob

consts:
  source: Source::Job

base:
  default_required: false
  fields:
    JobId:
      type: String
      required: true
    JobClass:
      type: String
      required: true
    QueueName: Symbol
    Arguments: 'T::Array[T.untyped]'
    Executions: Integer
    ProviderJobId: String

events:
  Enqueue:
    fields:
      Retries:
        type: Integer
        required: false

  Schedule:
    fields:
      ScheduledAt: Time

  Start:
    fields:
      StartedAt: Time
      Attempt:
        type: Integer
        required: false

  Finish:
    fields:
      DurationMs: Float
      FinishedAt: Time

  # The job raised an exception
  Error:
    fields:
      ErrorClass:
        type: 'T.class_of(Exception)'
        required: true
      Message:
        type: String
        required: true
      Backtrace:
        type: 'T::Array[String]'
        required: false
