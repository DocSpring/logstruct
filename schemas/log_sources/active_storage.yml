source: ActiveStorage

consts:
  source: Source::Storage

base:
  fields:
    Storage: Symbol
    # Left out when a prefix of keys is deleted
    FileId:
      type: String
      required: false

events:
  # Rails' events have the blob's key, not its filename (which can name a person)
  Upload:
    default_required: false
    fields:
      DurationMs:
        type: Float
      Checksum: String

  Download:
    default_required: false
    fields:
      Range: String
      DurationMs:
        type: Float
        required: false

  # One file, or every file whose key starts with prefix (a blob's variants)
  Delete:
    default_required: false
    fields:
      Prefix: String

  # A stored file's metadata updated: its content type. Not the disposition, which has the filename.
  Metadata:
    default_required: false
    fields:
      MimeType: String

  Exist:
    default_required: false
    fields:
      Exist: T::Boolean

  # The URL is left out: it's signed, and anyone with it can read the file until it expires
  Url:
    fields: {}
