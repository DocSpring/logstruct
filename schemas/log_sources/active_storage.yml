source: ActiveStorage

consts:
  source: Source::Storage

base:
  fields:
    Storage: Symbol
    # Left out when a prefix of keys is deleted
    FileId:
      type: String
      required: false

events:
  Upload:
    default_required: false
    fields:
      Filename: String
      MimeType: String
      Size: Integer
      Metadata: 'T::Hash[String, T.untyped]'
      DurationMs:
        type: Float
      Checksum: String

  Download:
    default_required: false
    fields:
      Filename: String
      Range: String
      DurationMs:
        type: Float
        required: false

  # One file, or every file whose key starts with prefix (a blob's variants)
  Delete:
    default_required: false
    fields:
      Prefix: String

  Metadata:
    default_required: false
    fields:
      Metadata: 'T::Hash[String, T.untyped]'

  Exist:
    default_required: false
    fields:
      Exist: T::Boolean

  # The URL is left out: it's signed, and anyone with it can read the file until it expires
  Url:
    fields: {}
