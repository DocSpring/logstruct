source: Shrine

consts:
  source: Source::Shrine

events:
  Upload:
    fields:
      Storage: Symbol
      Location: String
      # From the file's metadata
      Filename:
        type: String
        required: false
      MimeType:
        type: String
        required: false
      Size:
        type: Integer
        required: false
      UploadOptions:
        type: 'T::Hash[Symbol, T.untyped]'
        required: false
      Options:
        type: 'T::Hash[Symbol, T.untyped]'
        required: false
      Uploader:
        type: String
        required: false
      DurationMs:
        type: Float
        required: false

  Download:
    fields:
      Storage: Symbol
      Location: String
      DownloadOptions:
        type: 'T::Hash[Symbol, T.untyped]'
        required: false

  Delete:
    fields:
      Storage: Symbol
      Location: String

  # Shrine extracted a file's metadata. Its event has no location, nor the metadata it extracted.
  Metadata:
    fields:
      Storage: Symbol
      DurationMs:
        type: Float
        required: false

  # Shrine checked whether a file exists. Its event doesn't say whether it did.
  Exist:
    fields:
      Storage: Symbol
      Location: String
