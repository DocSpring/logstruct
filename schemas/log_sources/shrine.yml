source: Shrine

consts:
  source: Source::Shrine

additional_data: true

events:
  Upload:
    fields:
      Storage: Symbol
      Location: String
      UploadOptions:
        type: 'T::Hash[Symbol, T.untyped]'
        required: false
      Options:
        type: 'T::Hash[Symbol, T.untyped]'
        required: false
      Uploader:
        type: String
        required: false
      DurationMs:
        type: Float
        required: false

  Download:
    fields:
      Storage: Symbol
      Location: String
      DownloadOptions:
        type: 'T::Hash[Symbol, T.untyped]'
        required: false

  Delete:
    fields:
      Storage: Symbol
      Location: String

  Metadata:
    fields:
      Storage: Symbol
      Location:
        type: String
        required: false
      Metadata:
        type: 'T::Hash[String, T.untyped]'
        required: false

  Exist:
    fields:
      Storage: Symbol
      Location: String
      Exist:
        type: T::Boolean
        required: false
