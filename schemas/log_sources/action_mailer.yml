source: ActionMailer

consts:
  source: Source::Mailer

additional_data: true

base:
  default_required: false
  fields:
    To: 'T::Array[String]'
    From: String
    Subject: String
    MessageId: String
    MailerClass: String
    MailerAction: String
    AttachmentCount: Integer

events:
  Delivery:
  Delivered:
  Error:
    fields:
      ErrClass: String
      ErrorMessage: String
      Backtrace:
        type: 'T::Array[String]'
        required: false
