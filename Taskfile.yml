version: '3'

includes:
  ruby: ./Taskfile.ruby.yml
  rails: ./Taskfile.rails.yml
  docs: ./Taskfile.docs.yml
  prettier: ./Taskfile.prettier.yml
  yard: ./Taskfile.yard.yml
  gem: ./Taskfile.gem.yml

tasks:
  generate:
    desc: Regenerate LogStruct Ruby and TypeScript structs
    cmds:
      - task: ruby:generate

  typecheck:
    desc: Run Sorbet and TypeScript type checking
    cmds:
      - task: ruby:typecheck
      - task: docs:typecheck

  lint:
    desc: Run Ruby and frontend linters
    cmds:
      - task: ruby:lint
      - task: prettier:check
      - task: docs:lint

  lint:fix:
    desc: Auto-fix Ruby and frontend lint issues
    cmds:
      - task: ruby:lint:fix
      - task: prettier:write
      - task: docs:lint:fix

  spellcheck:
    aliases: [cspell]
    desc: Run repository spellcheck
    deps: [prettier:deps]
    cmds:
      - scripts/spellcheck.sh

  test:
    desc: Run Ruby unit tests, Rails integration tests, and merge coverage
    cmds:
      - task: ruby:test
      - task: rails:test
      - task: ruby:coverage:merge

  ci:
    desc: Run the full validation workflow
    cmds:
      # First: generate files and run tapioca (needed by other tasks)
      - task: generate
      - task: ruby:tapioca
      # Second: parallel checks (typecheck, lint, spellcheck, docs tests)
      - task: ci:checks
      # Third: run tests sequentially (ruby then rails to avoid port conflicts)
      - task: test

  ci:checks:
    desc: Run parallel CI checks (typecheck, lint, spellcheck, docs tests)
    deps:
      - typecheck
      - lint
      - spellcheck
      - docs:test

  fix:
    desc: Auto-fix lint issues then run the full validation workflow (replaces scripts/all_write.sh)
    cmds:
      - task: generate
      - task: typecheck
      - task: lint:fix
      - task: spellcheck
      - task: docs:test
      - task: test
