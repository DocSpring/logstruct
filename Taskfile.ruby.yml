version: '3'
run: once

tasks:
  generate:
    desc: Generate Sorbet structs, TypeScript artifacts, and provider catalog
    run: once
    cmds:
      - bundle exec ruby scripts/generate_structs.rb
      - bundle exec ruby scripts/export_provider_catalog.rb

  tapioca:
    desc: Run Tapioca
    deps: [generate]
    cmds:
      - bundle exec tapioca gems
      - bundle exec tapioca dsl
      - bundle exec tapioca annotations

  typecheck:
    desc: Run Sorbet type checking
    deps: [generate]
    cmds:
      - scripts/typecheck.sh

  lint:
    desc: Run RuboCop
    deps: [generate]
    cmds:
      # Specify directories explicitly to avoid traversing node_modules
      - bundle exec ruby bin/rubocop lib/ test/ scripts/ tools/ rails_test_app/templates/

  lint:fix:
    desc: Auto-correct RuboCop offenses
    deps: [generate]
    cmds:
      # Specify directories explicitly to avoid traversing node_modules
      - bundle exec ruby bin/rubocop -A lib/ test/ scripts/ tools/ rails_test_app/templates/

  check-generated:
    desc: Ensure generated Ruby structs are up to date (CI safe)
    cmds:
      - scripts/check_generated.sh

  test:
    desc: Run Ruby unit tests
    deps: [generate]
    cmds:
      - bundle exec ruby scripts/test.rb

  coverage:merge:
    desc: Merge Ruby and Rails coverage reports
    cmds:
      - scripts/merge_coverage.sh
