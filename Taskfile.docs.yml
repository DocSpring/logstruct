version: '3'
run: once

tasks:
  deps:
    dir: docs
    desc: Install frontend dependencies (pnpm)
    cmds:
      - pnpm install --frozen-lockfile

  typecheck:
    dir: docs
    desc: Run TypeScript type checking
    # The pages import docs/generated, which isn't committed
    deps: [deps, ':ruby:generate']
    cmds:
      - pnpm exec tsc --noEmit

  lint:
    dir: docs
    desc: Run Biome linter and formatter check
    deps: [deps]
    cmds:
      - npm run lint

  lint:fix:
    dir: docs
    desc: Run Biome with auto-fix
    deps: [deps]
    cmds:
      - npm run lint:fix

  test:
    dir: docs
    desc: Run frontend tests
    # The tests import docs/generated, which isn't committed
    deps: [deps, ':ruby:generate']
    cmds:
      - npm test
