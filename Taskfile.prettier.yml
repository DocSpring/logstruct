version: '3'
run: once

tasks:
  deps:
    desc: Install repository tooling dependencies (pnpm)
    cmds:
      - pnpm install --frozen-lockfile

  check:
    desc: Check formatting with Prettier
    deps: [deps]
    cmds:
      - scripts/prettier.sh --check

  write:
    desc: Format files with Prettier
    deps: [deps]
    cmds:
      - scripts/prettier.sh --write
